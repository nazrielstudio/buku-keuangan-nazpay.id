<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAZPAY — Bukti Buku Keuangan</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>
:root{--bg:#07101f;--panel:#0d1a2c;--panel2:#101f34;--line:#20334c;--blue:#247cff;--gold:#d8ad52;--white:#f4f7fb;--muted:#91a1b6;--green:#35d39a;--red:#ff6b76}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#102b4c 0,#07101f 38%,#050b14 100%);color:var(--white);font-family:Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:255px;background:rgba(5,12,23,.92);border-right:1px solid var(--line);padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:10}.brand{font-weight:900;letter-spacing:.08em;font-size:22px}.brand span{color:var(--gold)}.tag{color:var(--muted);font-size:11px;margin-top:4px}.nav{margin-top:30px;display:grid;gap:7px}.nav button{background:transparent;border:0;color:#b9c6d8;text-align:left;padding:12px 13px;border-radius:12px}.nav button.active,.nav button:hover{background:linear-gradient(90deg,#123765,#0e2138);color:#fff}.main{margin-left:255px;width:calc(100% - 255px);padding:28px;max-width:1700px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.eyebrow{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.16em}.title{font-size:30px;font-weight:850;margin:5px 0}.sub{color:var(--muted)}.btn{border:1px solid var(--line);background:#122238;color:#fff;border-radius:11px;padding:10px 14px}.btn.primary{background:linear-gradient(135deg,#1d70e8,#3c8dff);border-color:#3d8df4}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,rgba(18,34,55,.96),rgba(8,18,31,.96));border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.2)}.label{font-size:12px;color:var(--muted)}.value{font-size:22px;font-weight:800;margin-top:10px}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.charts{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.chartbox{height:340px}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:13px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:#9fb0c5;background:#0b1727}.mobileNav{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.show{display:flex}.modalbox{width:min(560px,100%);background:#0c192b;border:1px solid var(--line);border-radius:18px;padding:22px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{background:#081323;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:15px}.hidden{display:none}.loginbox{max-width:390px;width:100%}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:1fr}}
@media(max-width:700px){.side{display:none}.main{margin-left:0;width:100%;padding:16px 14px 88px}.top{align-items:flex-start}.title{font-size:23px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:14px}.value{font-size:18px}.mobileNav{display:flex;position:fixed;z-index:20;left:10px;right:10px;bottom:10px;background:rgba(7,16,31,.94);border:1px solid var(--line);border-radius:17px;padding:7px;justify-content:space-around;backdrop-filter:blur(15px)}.mobileNav button{border:0;background:transparent;color:#9badc2;font-size:11px;padding:7px}.mobileNav button.active{color:#fff}.chartbox{height:270px}.table{min-width:760px}}
</style></head><body><div id="root"></div><div class="modal" id="modal"><div class="modalbox" id="modalContent"></div></div><script>
const IDR=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);let data={transactions:[],testimonials:[],partners:[],settings:{}};let admin=false;let chart1,chart2;
async function api(url,opt={}){const r=await fetch('/api/'+url,opt);const j=await r.json();if(!r.ok)throw Error(j.error||'Terjadi kesalahan');return j}
function calc(){let t=data.transactions||[];let inc=t.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0), exp=t.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0), hpp=t.reduce((s,x)=>s+Number(x.hpp||0),0);return {inc,exp,hpp,gross:inc-hpp,net:inc-hpp-exp,balance:inc-exp};}
function layout(){document.getElementById('root').innerHTML=`<aside class="side"><div class="brand">NAZ<span>PAY</span></div><div class="tag">BUKTI BUKU KEUANGAN</div><div class="nav"><button class="active">Dashboard</button><button onclick="section('trans')">Buku Transaksi</button><button onclick="section('reports')">Laporan Harian/Bulanan</button><button onclick="section('proof')">Bukti Keuangan</button><button onclick="section('testi')">Testimoni</button><button onclick="section('partner')">Partner / Mitra</button><button onclick="section('contact')">Contact</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow">NAZPAY • Financial Control</div><div class="title">Dashboard Keuangan</div><div class="sub">Ringkasan usaha yang berubah otomatis dari data transaksi.</div></div><div><button class="btn" onclick="login()">${admin?'Admin Aktif':'Admin Login'}</button></div></div><div id="content"></div></main><nav class="mobileNav"><button class="active" onclick="section('dash')">⌂<br>Dashboard</button><button onclick="section('trans')">▤<br>Transaksi</button><button onclick="section('reports')">▥<br>Laporan</button><button onclick="section('more')">⋯<br>Lainnya</button></nav>`;dashboard();}
function dashboard(){const c=calc();document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Saldo Bersih</div><div class="value gold">${IDR(c.balance)}</div></div><div class="card"><div class="label">Pemasukan</div><div class="value green">${IDR(c.inc)}</div></div><div class="card"><div class="label">HPP / Modal</div><div class="value">${IDR(c.hpp)}</div></div><div class="card"><div class="label">Pengeluaran</div><div class="value red">${IDR(c.exp)}</div></div><div class="card"><div class="label">Laba Bersih</div><div class="value gold">${IDR(c.net)}</div></div></div><div class="charts"><div class="card"><div class="label">Tren keuangan</div><div class="chartbox"><canvas id="chart1"></canvas></div></div><div class="card"><div class="label">Komposisi keuangan</div><div class="chartbox"><canvas id="chart2"></canvas></div></div></div><div class="section"><h2>Transaksi Terbaru</h2>${table(data.transactions.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,10))}</div>`;renderCharts();}
function table(rows){if(!rows.length)return '<div class="card empty">Belum ada transaksi.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Nominal</th><th>HPP</th><th>Laba</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date||'-'}</td><td>${x.type==='income'?'Pemasukan':'Pengeluaran'}</td><td>${x.note||'-'}</td><td>${IDR(x.amount)}</td><td>${IDR(x.hpp)}</td><td>${IDR(x.type==='income'?Number(x.amount)-Number(x.hpp||0):-Number(x.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function renderCharts(){if(chart1)chart1.destroy();if(chart2)chart2.destroy();let ctx=document.getElementById('chart1');if(!ctx)return;let by={};for(const x of data.transactions){let k=(x.date||'').slice(0,7)||'Tanpa tanggal';by[k]??={i:0,e:0,l:0};if(x.type==='income'){by[k].i+=Number(x.amount||0);by[k].l+=Number(x.amount||0)-Number(x.hpp||0)}else{by[k].e+=Number(x.amount||0);by[k].l-=Number(x.amount||0)}}let keys=Object.keys(by).sort();chart1=new Chart(ctx,{type:'line',data:{labels:keys,datasets:[{label:'Pemasukan',data:keys.map(k=>by[k].i),borderColor:'#35d39a',backgroundColor:'transparent',tension:.35},{label:'Pengeluaran',data:keys.map(k=>by[k].e),borderColor:'#ff6b76',backgroundColor:'transparent',tension:.35},{label:'Laba Bersih',data:keys.map(k=>by[k].l),borderColor:'#d8ad52',backgroundColor:'transparent',tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#dce5f0'}}},scales:{x:{ticks:{color:'#91a1b6'},grid:{color:'#20334c'}},y:{ticks:{color:'#91a1b6'},grid:{color:'#20334c'}}}}});let c=calc();chart2=new Chart(document.getElementById('chart2'),{type:'doughnut',data:{labels:['Pemasukan','HPP','Pengeluaran'],datasets:[{data:[c.inc,c.hpp,c.exp],backgroundColor:['#35d39a','#d8ad52','#ff6b76'],borderColor:'#0d1a2c'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#dce5f0'}}}}});}
async function login(){if(admin){await api('logout',{method:'POST'});admin=false;layout();return}modal(`<div class="loginbox"><div class="eyebrow">ADMIN ACCESS</div><h2>Masuk ke NAZPAY</h2><div class="field"><label>PIN Admin</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Masukkan PIN"></div><div class="actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="doLogin()">Masuk</button></div></div>`)}async function doLogin(){try{await api('login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});admin=true;closeModal();layout();alert('Login admin berhasil.')}catch(e){alert(e.message)}}
function section(s){if(s==='dash'){dashboard();return}if(s==='more'){document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><b>Bukti Keuangan</b><p class="sub">Arsip bukti transaksi dan dokumen.</p><button class="btn" onclick="section('proof')">Buka</button></div><div class="card"><b>Testimoni</b><p class="sub">Tampilan testimoni pelanggan.</p><button class="btn" onclick="section('testi')">Buka</button></div><div class="card"><b>Partner / Mitra</b><p class="sub">Pengajuan kerja sama.</p><button class="btn" onclick="section('partner')">Buka</button></div></div>`;return}if(s==='trans'){if(!admin){login();return}document.getElementById('content').innerHTML=`<div class="top"><div><h2>Buku Transaksi</h2><div class="sub">Tambah dan kelola transaksi.</div></div><button class="btn primary" onclick="addTx()">+ Tambah Transaksi</button></div>${table(data.transactions)}`;return}if(s==='reports'){let months={};for(const x of data.transactions){let k=(x.date||'').slice(0,7)||'Tanpa tanggal';months[k]??=[];months[k].push(x)}let rows=Object.entries(months).sort().reverse().map(([m,r])=>{let inc=r.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0),exp=r.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0),hpp=r.reduce((s,x)=>s+Number(x.hpp||0),0);return {m,inc,exp,hpp,g:inc-hpp,n:inc-hpp-exp}});document.getElementById('content').innerHTML=`<h2>Laporan Harian & Bulanan</h2><div class="section"><h2>Rekap Bulanan</h2><div class="tablewrap"><table class="table"><thead><tr><th>Bulan</th><th>Pemasukan</th><th>HPP</th><th>Laba Kotor</th><th>Pengeluaran</th><th>Laba Bersih</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.m}</td><td>${IDR(r.inc)}</td><td>${IDR(r.hpp)}</td><td>${IDR(r.g)}</td><td>${IDR(r.exp)}</td><td>${IDR(r.n)}</td></tr>`).join('')}</tbody></table></div></div><div class="section"><h2>Catatan Harian</h2>${table(data.transactions.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))))}</div>`;return}if(s==='proof'){document.getElementById('content').innerHTML=`<h2>Bukti Keuangan</h2><p class="sub">Bukti tersimpan bersama transaksi. Pengelolaan file hanya tersedia untuk admin.</p>${admin?'<button class="btn primary" onclick="addTx()">+ Tambah Transaksi & Bukti</button>':''}<div class="section">${table(data.transactions.filter(x=>x.proof).map(x=>({...x,note:(x.note||'')+' • '+x.proof})))}</div>`;return}if(s==='testi'){document.getElementById('content').innerHTML=`<h2>Testimoni Penjualan</h2><div class="grid">${(data.testimonials||[]).map(x=>`<div class="card"><b>${x.name||'Pelanggan'}</b><p class="sub">${x.text||''}</p></div>`).join('')||'<div class="card empty">Belum ada testimoni.</div>'}</div>`;return}if(s==='partner'){document.getElementById('content').innerHTML=`<h2>Partner / Mitra</h2><p class="sub">Ajukan kerja sama dengan NAZPAY.</p><button class="btn primary" onclick="partnerForm()">Ajukan Kerja Sama</button>${admin?'<div class="section">'+table((data.partners||[]).map(x=>({date:x.date,type:x.status,note:x.name+' • '+x.message,amount:0,hpp:0})))+'</div>':''}`;return}if(s==='contact'){document.getElementById('content').innerHTML=`<h2>Contact Person</h2><div class="card"><h3>NAZPAY Official</h3><p class="sub">${data.settings?.contact||'Kontak resmi NAZPAY'}</p><p class="sub">Untuk transaksi, partnership, rekber, dan kebutuhan layanan digital.</p></div>`}}
function addTx(){modal(`<h2>Tambah Transaksi</h2><div class="field"><label>Tanggal</label><input id="d" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Jenis</label><select id="ty"><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select></div><div class="field"><label>Keterangan</label><input id="no" placeholder="Contoh: Penjualan diamond FF"></div><div class="field"><label>Nominal</label><input id="am" type="number" placeholder="0"></div><div class="field"><label>HPP / Modal transaksi</label><input id="hp" type="number" placeholder="0"></div><div class="actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveTx()">Simpan</button></div>`)}async function saveTx(){data.transactions.push({id:crypto.randomUUID(),date:d.value,type:ty.value,note:no.value,amount:Number(am.value||0),hpp:Number(hp.value||0)});await api('data',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});closeModal();dashboard();alert('Transaksi tersimpan.');}
function partnerForm(){modal(`<h2>Pengajuan Kerja Sama</h2><div class="field"><label>Nama / Brand</label><input id="pn"></div><div class="field"><label>Kontak</label><input id="pc"></div><div class="field"><label>Pesan</label><textarea id="pm"></textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="savePartner()">Kirim</button></div>`)}async function savePartner(){data.partners.push({id:crypto.randomUUID(),date:new Date().toISOString().slice(0,10),name:pn.value,contact:pc.value,message:pm.value,status:'Baru'});await api('data',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});closeModal();section('partner');alert('Pengajuan terkirim.');}
function modal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
(async()=>{try{data=await api('public')}catch{}try{data=await api('data');admin=true}catch{}layout()})();
</script></body></html>
